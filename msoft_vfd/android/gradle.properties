org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Gradle 8.14 (this project's wrapper) doesn't support running on JDK 25, which
# is this machine's default `java`. Pin the Android build to Homebrew's JDK 17
# instead, without touching the global JAVA_HOME/java used elsewhere.
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
